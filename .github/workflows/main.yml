name: Build the game

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.0.1'
      mode:
        description: 'Build mode'
        type: choice
        options: [fast, full]
        default: fast
      type:
        description: 'Build type'
        type: choice
        options: [release, debug, profile]
        default: release
      platforms:
        description: 'Platforms (comma: win,linux,android)'
        default: 'win,linux,android'
      basegame:
        description: 'Include base game assets'
        type: boolean
        default: true
      publish:
        description: 'Publish GitHub Release (else artifacts only)'
        type: boolean
        default: false
      draft:
        description: 'Release as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Release as prerelease'
        type: boolean
        default: false
      retention:
        description: 'Artifact retention days'
        type: number
        default: 7

permissions:
  contents: write

# One build/release per version at a time, so two runs can't race and create
# duplicate draft releases for the same tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  CacheDesktop:
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-latest
      CACHE_NAME: K-Slice2.desktop-cache
      setupScript: sh ./setup/unix.sh

  CacheMobile:
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-latest
      CACHE_NAME: K-Slice2.mobile-cache-linux
      setupScript: sh ./setup/mobile.sh

  Windows:
    needs: CacheDesktop
    if: contains(inputs.platforms, 'win')
    uses: ./.github/workflows/build.yml
    with:
      name: Windows
      os: windows-2022
      buildArgs: windows
      exportPath: windows
      artifactName: K-Slice_${{ inputs.version }}_windows_${{ inputs.type }}
      cachePath: K-Slice2.build-windows
      cacheLibrariesPath: K-Slice2.desktop-cache
      buildMode: ${{ inputs.mode }}
      buildType: ${{ inputs.type }}
      basegame: ${{ inputs.basegame }}
      retentionDays: ${{ fromJSON(inputs.retention) }}

  Linux:
    needs: CacheDesktop
    if: contains(inputs.platforms, 'linux')
    uses: ./.github/workflows/build.yml
    with:
      name: Linux
      os: ubuntu-22.04
      buildArgs: linux
      exportPath: linux
      artifactName: K-Slice_${{ inputs.version }}_linux_${{ inputs.type }}
      cachePath: K-Slice2.build-linux
      cacheLibrariesPath: K-Slice2.desktop-cache
      buildMode: ${{ inputs.mode }}
      buildType: ${{ inputs.type }}
      basegame: ${{ inputs.basegame }}
      retentionDays: ${{ fromJSON(inputs.retention) }}

  Android:
    needs: CacheMobile
    # Run even if the cache job was cancelled; the build restores the existing
    # .haxelib cache itself and fails loudly on a cache miss.
    if: ${{ !cancelled() && contains(inputs.platforms, 'android') }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: Android
      os: ubuntu-22.04
      buildArgs: android
      exportPath: android
      artifactName: K-Slice_${{ inputs.version }}_android_${{ inputs.type }}
      cachePath: K-Slice2.build-android-linux
      cacheLibrariesPath: K-Slice2.mobile-cache-linux
      buildMode: ${{ inputs.mode }}
      buildType: ${{ inputs.type }}
      basegame: ${{ inputs.basegame }}
      retentionDays: ${{ fromJSON(inputs.retention) }}

  Release:
    name: Publish Release
    needs: [Windows, Linux, Android]
    # Publish only when every requested platform actually built. A skipped
    # platform job (e.g. dependency cancelled) no longer produces a partial release.
    if: >-
      ${{
        inputs.publish && !cancelled() && !failure() &&
        (needs.Windows.result == 'success' || !contains(inputs.platforms, 'win')) &&
        (needs.Linux.result == 'success' || !contains(inputs.platforms, 'linux')) &&
        (needs.Android.result == 'success' || !contains(inputs.platforms, 'android'))
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f -printf '%p (%s bytes)\n'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: K-Slice v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## K-Slice v${{ inputs.version }}
            Build: `${{ inputs.mode }}` / `${{ inputs.type }}`
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Summary:
    name: Build Summary
    needs: [Windows, Linux, Android, Release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 K-Slice Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.Windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.Linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.Android.result }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Release: [v${{ inputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          fi
