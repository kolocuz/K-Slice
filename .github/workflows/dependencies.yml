on:
  workflow_call:
    inputs:
      CACHE_NAME:
        required: true
        type: string
      os:
        required: true
        type: string
      setupScript:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: K-Slice

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    permissions:
      pull-requests: write
    steps:
      - name: Restore Libraries for compilation
        id: load-lib-cache
        uses: actions/cache@v4
        with:
          key: ${{ inputs.CACHE_NAME }}
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            ${{ inputs.CACHE_NAME }}

      - name: Checkout
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Setup Haxe
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        run: haxelib newrepo

      - name: Install Libraries
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.setupScript }}

      - name: Install hxvlc
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        run: haxelib install hxvlc 2.2.2 --quiet

      - name: Install VLC dependencies (Linux)
        if: inputs.os == 'ubuntu-latest' && steps.load-lib-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y vlc libvlc-dev libvlccore-dev vlc-bin

      - name: Uploading new cache
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          key: ${{ inputs.CACHE_NAME }}
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            ${{ inputs.CACHE_NAME }}
