name: Build the game

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1)'
        required: true
        default: 'None'
        type: string

jobs:
  BuildCaches:
    name: ${{ matrix.name }} Cache
    permissions: write-all
    strategy:
      matrix:
        include:
          - name: Desktop
            os: ubuntu-latest
            setupScript: sh ./setup/unix.sh
            CACHE_NAME: K-Slice2.desktop-cache
          - name: Mobile
            os: macos-latest
            setupScript: sh ./setup/mobile.sh
            CACHE_NAME: K-Slice2.mobile-cache
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ${{ matrix.os }}
      CACHE_NAME: ${{ matrix.CACHE_NAME }}
      setupScript: ${{ matrix.setupScript }}

  BuildDesktop:
    name: ${{ matrix.name }}
    needs: BuildCaches
    permissions: write-all
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: windows
            exportPath: windows
            artifactName: K-Slice_${{ inputs.version }}_windows
            artifactPath: export\release\windows\bin\*
            cachePath: K-Slice2.build-windows
            cacheLibrariesPath: K-Slice2.desktop-cache
          - name: Linux
            os: ubuntu-22.04
            buildArgs: linux
            exportPath: linux
            artifactName: K-Slice_${{ inputs.version }}_linux
            artifactPath: export/release/linux/bin/*
            cachePath: K-Slice2.build-linux
            cacheLibrariesPath: K-Slice2.desktop-cache
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      exportPath: ${{ matrix.exportPath }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      cachePath: ${{ matrix.cachePath }}
      cacheLibrariesPath: ${{ matrix.cacheLibrariesPath }}

  BuildMobile:
    name: ${{ matrix.name }}
    needs: BuildCaches
    permissions: write-all
    strategy:
      matrix:
        include:
          - name: Android
            os: macos-15
            buildArgs: "android"
            exportPath: android
            artifactName: K-Slice_${{ inputs.version }}_android
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
            cachePath: K-Slice2.build-android
            cacheLibrariesPath: K-Slice2.mobile-cache
          - name: iOS
            os: macos-15
            buildArgs: "ios -nosign"
            exportPath: ios
            artifactName: K-Slice_${{ inputs.version }}_ios
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
            cachePath: K-Slice2.build-ios
            cacheLibrariesPath: K-Slice2.mobile-cache
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      exportPath: ${{ matrix.exportPath }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      cachePath: ${{ matrix.cachePath }}
      cacheLibrariesPath: ${{ matrix.cacheLibrariesPath }}

  Release:
    name: Create Release
    needs: [BuildDesktop, BuildMobile]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: K-Slice v${{ inputs.version }}
          body: |
            K-Slice v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
