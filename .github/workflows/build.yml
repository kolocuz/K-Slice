on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      exportPath:
        required: true
        type: string
      cachePath:
        required: true
        type: string
      cacheLibrariesPath:
        required: true
        type: string
      buildMode:
        required: false
        type: string
        default: 'fast'      # fast | full
      buildType:
        required: false
        type: string
        default: 'release'   # release | debug | profile
      basegame:
        required: false
        type: boolean
        default: true
      retentionDays:
        required: false
        type: number
        default: 7

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: K-Slice

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set XCode app
        if: inputs.os == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Restore Libraries for compilation
        uses: actions/cache@v4
        with:
          key: ${{ inputs.cacheLibrariesPath }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            ${{ inputs.cacheLibrariesPath }}

      - name: Restore existing build cache (fast only)
        if: inputs.buildMode == 'fast'
        uses: actions/cache@v4
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/release/${{ inputs.exportPath }}/haxe/
            export/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            ${{ inputs.cachePath }}

      - name: Install libVLC
        if: inputs.exportPath == 'linux'
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Configure Android
        if: inputs.exportPath == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: |
          FLAGS="${{ inputs.buildArgs }}"
          if [[ "${{ inputs.buildType }}" == "debug" ]]; then FLAGS="$FLAGS -Ddebug"; fi
          if [[ "${{ inputs.buildType }}" == "profile" ]]; then FLAGS="$FLAGS -DPROFILE_BUILD"; fi
          if [[ "${{ inputs.basegame }}" == "false" ]]; then FLAGS="$FLAGS -DNO_BASEGAME_FILES"; fi
          if [[ "${{ inputs.buildMode }}" == "full" ]]; then FLAGS="$FLAGS -clean"; fi
          echo "Compiling: haxelib run lime build $FLAGS"
          haxelib run lime build $FLAGS

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          case "${{ inputs.exportPath }}" in
            windows)
              cd export/release/windows/bin
              zip -r "$GITHUB_WORKSPACE/dist/${{ inputs.artifactName }}.zip" .
              ;;
            linux)
              tar -C export/release/linux/bin -czf "dist/${{ inputs.artifactName }}.tar.gz" .
              ;;
            android)
              apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
              test -n "$apk_path"
              cp "$apk_path" "dist/${{ inputs.artifactName }}.apk"
              ;;
            ios)
              cp export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.ipa "dist/${{ inputs.artifactName }}.ipa"
              ;;
            *)
              echo "Unknown exportPath: ${{ inputs.exportPath }}"; exit 1
              ;;
          esac
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retentionDays }}

      - name: Clearing already existing cache
        if: inputs.buildMode == 'fast'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const cache of caches.data.actions_caches) {
                if (cache.key === "${{ inputs.cachePath }}") {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (error) {
              console.error("Failed to clear cache:", error);
            }

      - name: Uploading new cache
        if: inputs.buildMode == 'fast'
        uses: actions/cache@v4
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/release/${{ inputs.exportPath }}/haxe/
            export/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            ${{ inputs.cachePath }}
